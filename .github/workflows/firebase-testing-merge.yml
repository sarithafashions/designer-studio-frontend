name: Deploy to Firebase Hosting - Testing Live

on:
  push:
    branches:
      - testing

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build with Testing Environment Variables
        run: npx cross-env VITE_API_BASE_URL=https://testing-saritha-fashion-156538435086.asia-south2.run.app npm run build

      - name: Deploy to Firebase Hosting (Live Testing Site)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARITHADESIGNERSTUDIO_B81A8 }}
          projectId: sarithadesignerstudio-b81a8
          target: testing
          channelId: live

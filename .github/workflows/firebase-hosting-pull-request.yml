name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - production

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build with Production Environment Variables
        run: npx cross-env VITE_API_BASE_URL=https://sarithafashion-backend-156538435086.asia-south1.run.app npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARITHADESIGNERSTUDIO_B81A8 }}
          projectId: sarithadesignerstudio-b81a8
          target: production
          entryPoint: ./

